<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Parking — Ticket</title>
<link rel="stylesheet" href="style.css">
<style>
body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; }

.ticket-wrap { width: 100%; max-width: 480px; }

.ticket-header { text-align: center; margin-bottom: 24px; }
.ticket-header .success-ring {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: rgba(6,214,160,0.15);
  border: 2px solid rgba(6,214,160,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  margin: 0 auto 16px;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(6,214,160,0.3); }
  50% { box-shadow: 0 0 0 16px rgba(6,214,160,0); }
}

.ticket-header h2 { font-size: 26px; margin-bottom: 4px; }
.ticket-header p { color: var(--muted); font-size: 14px; }

.ticket-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
}

.ticket-top {
  background: linear-gradient(135deg, var(--accent), #8b5cf6);
  padding: 24px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.ticket-top .park-name {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 800;
  color: white;
}

.ticket-top .booking-id {
  font-size: 12px;
  color: rgba(255,255,255,0.7);
  margin-top: 3px;
}

.ticket-top .status-pill {
  background: rgba(255,255,255,0.2);
  color: white;
  padding: 6px 14px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 700;
}

/* Dashed tear line */
.tear-line {
  display: flex;
  align-items: center;
  background: var(--surface);
  position: relative;
}

.tear-circle {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--bg);
  flex-shrink: 0;
}

.tear-dashes {
  flex: 1;
  border-top: 2px dashed var(--border);
  margin: 0 -2px;
}

.ticket-body {
  padding: 28px;
}

.ticket-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 24px;
}

.ticket-field { }
.ticket-field .field-label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-weight: 700;
  margin-bottom: 4px;
}

.ticket-field .field-val {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}

.ticket-slots {
  background: rgba(108,99,255,0.08);
  border: 1px solid rgba(108,99,255,0.2);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 20px;
}

.ticket-slots .field-label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-weight: 700;
  margin-bottom: 8px;
}

.slot-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.slot-pill {
  background: var(--accent);
  color: white;
  padding: 4px 12px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 700;
}

.ticket-amount {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 18px;
  background: linear-gradient(135deg, rgba(255,209,102,0.1), rgba(244,162,97,0.08));
  border: 1px solid rgba(255,209,102,0.2);
  border-radius: var(--radius-sm);
  margin-bottom: 24px;
}

.ticket-amount .label { font-size: 14px; color: var(--muted); }
.ticket-amount .amount {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  font-weight: 800;
  color: var(--gold);
}

.ticket-actions {
  display: flex;
  gap: 12px;
}

.ticket-actions .btn {
  flex: 1;
  justify-content: center;
  padding: 13px;
}
</style>
</head>
<body>

<div class="ticket-wrap">
  <div class="ticket-header">
    <div class="success-ring"><img src="images/logo.png" alt="Logo" style="width:52px;height:52px;border-radius:50%;object-fit:cover;"></div>
    <h2>Booking Confirmed!</h2>
    <p>Your parking slot has been reserved successfully</p>
  </div>

  <div class="ticket-card">
    <div class="ticket-top">
      <div style="display:flex;align-items:center;gap:12px;">
        <img src="images/logo.png" alt="Logo" style="width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.4);">
        <div>
          <div class="park-name">SmartPark</div>
          <div class="booking-id" id="tId">Loading...</div>
        </div>
      </div>
      <div class="status-pill">✓ Confirmed</div>
    </div>

    <div class="tear-line">
      <div class="tear-circle"></div>
      <div class="tear-dashes"></div>
      <div class="tear-circle"></div>
    </div>

    <div class="ticket-body">
      <div class="ticket-grid">
        <div class="ticket-field">
          <div class="field-label">Mall</div>
          <div class="field-val" id="tMall">—</div>
        </div>
        <div class="ticket-field">
          <div class="field-label">Date</div>
          <div class="field-val" id="tDate">—</div>
        </div>
        <div class="ticket-field">
          <div class="field-label">Time Slot</div>
          <div class="field-val" id="tTime">—</div>
        </div>
        <div class="ticket-field">
          <div class="field-label">Vehicle</div>
          <div class="field-val" id="tVehicle">—</div>
        </div>
        <div class="ticket-field">
          <div class="field-label">UPI / Payment</div>
          <div class="field-val" id="tUpi">—</div>
        </div>
        <div class="ticket-field">
          <div class="field-label">Status</div>
          <div class="field-val" style="color:var(--green)">✓ Active</div>
        </div>
      </div>

      <div class="ticket-slots">
        <div class="field-label">Reserved Slots</div>
        <div class="slot-pills" id="tSlots"></div>
      </div>

      <div class="ticket-amount">
        <span class="label">💰 Amount Paid</span>
        <span class="amount" id="tAmount">—</span>
      </div>

      <div class="ticket-actions">
        <button class="btn btn-ghost" onclick="window.print()">🖨️ Print</button>
        <button class="btn btn-primary" onclick="location.href='home.html'">Go to Home →</button>
      </div>
    </div>
  </div>
</div>
<footer class="footer">
  Developed by <span>Aarti Gore</span> &copy; 2026
</footer>
<script>
const bookings = JSON.parse(localStorage.getItem("bookings")) || [];
const latest = bookings[bookings.length - 1];

if (latest) {
  document.getElementById("tId").textContent = "ID: " + latest.id;
  document.getElementById("tMall").textContent = latest.mall;
  document.getElementById("tDate").textContent = latest.date;
  document.getElementById("tTime").textContent = `${latest.time}:00–${parseInt(latest.time)+1}:00`;
  document.getElementById("tVehicle").textContent = latest.vehicle;
  document.getElementById("tUpi").textContent = latest.userUpi || "—";
  document.getElementById("tAmount").textContent = "₹" + latest.amount;

  const slotPills = document.getElementById("tSlots");
  (latest.slots || []).forEach(s => {
    const span = document.createElement("span");
    span.className = "slot-pill";
    span.textContent = s;
    slotPills.appendChild(span);
  });
}
</script>
</body>
</html>
